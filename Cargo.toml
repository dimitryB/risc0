[workspace]
resolver = "2"
members = [
  "bonsai/sdk",
  "risc0/bigint2",
  "risc0/bigint2/methods",
  "risc0/binfmt",
  "risc0/build",
  "risc0/build_kernel",
  "risc0/cargo-risczero",
  "risc0/circuit/keccak",
  "risc0/circuit/keccak-sys",
  "risc0/circuit/recursion",
  "risc0/circuit/recursion-sys",
  "risc0/circuit/rv32im",
  "risc0/circuit/rv32im-sys",
  "risc0/core",
  "risc0/groth16",
  "risc0/groth16-sys",
  "risc0/povw",
  "risc0/povw/guests",
  "risc0/r0vm",
  "risc0/sys",
  "risc0/tools",
  "risc0/zkos/v1compat",
  "risc0/zkp",
  "risc0/zkvm",
  "risc0/zkvm/methods",
  "risc0/zkvm/platform",
  "risc0/zkvm/receipts",
  "rzup",
  "tools/hotbench",
  "website/doc-test/main",
  "xtask",
]
exclude = ["tools/crates-validator"]

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "Apache-2.0"
homepage = "https://risczero.com/"
repository = "https://github.com/risc0/risc0/"

[workspace.dependencies]
bonsai-sdk = { version = "1.4.3", default-features = false, path = "bonsai/sdk" }
hotbench = { path = "tools/hotbench" }
metal = "0.29"
risc0-bigint2 = { version = "1.4.14", default-features = false, path = "risc0/bigint2" }
risc0-binfmt = { version = "3.0.5", default-features = false, path = "risc0/binfmt" }
risc0-build = { version = "3.0.6", default-features = false, path = "risc0/build" }
risc0-build-kernel = { version = "2.1.0", default-features = false, path = "risc0/build_kernel" }
risc0-circuit-keccak = { version = "4.0.6", default-features = false, path = "risc0/circuit/keccak" }
risc0-circuit-keccak-sys = { version = "4.0.3", default-features = false, path = "risc0/circuit/keccak-sys" }
risc0-circuit-recursion = { version = "4.0.5", default-features = false, path = "risc0/circuit/recursion" }
risc0-circuit-recursion-sys = { version = "4.0.3", default-features = false, path = "risc0/circuit/recursion-sys" }
risc0-circuit-rv32im = { version = "4.0.5", default-features = false, path = "risc0/circuit/rv32im" }
risc0-circuit-rv32im-sys = { version = "4.0.3", default-features = false, path = "risc0/circuit/rv32im-sys" }
risc0-core = { version = "3.0.2", default-features = false, path = "risc0/core" }
risc0-groth16 = { version = "3.0.5", default-features = false, path = "risc0/groth16" }
risc0-groth16-sys = { version = "0.1.0", default-features = false, path = "risc0/groth16-sys" }
risc0-povw = { version = "0.4.3", default-features = false, path = "risc0/povw" }
risc0-r0vm = { version = "3.0.6", default-features = false, path = "risc0/r0vm" }
risc0-sys = { version = "1.5.0", default-features = false, path = "risc0/sys" }
risc0-zkos-v1compat = { version = "2.2.3", path = "risc0/zkos/v1compat" }
risc0-zkp = { version = "3.0.5", default-features = false, path = "risc0/zkp" }
risc0-zkvm = { version = "3.0.6", default-features = false, path = "risc0/zkvm" }
risc0-zkvm-platform = { version = "2.2.3", default-features = false, path = "risc0/zkvm/platform" }
rzup = { version = "0.5.2", default-features = false, path = "rzup" }
sppark = "0.1.12"

[profile.bench]
lto = true

# Always optimize; otherwise tests take excessively long.
[profile.dev]
opt-level = 3

[profile.release]
lto = true

# sppark from the hemilabs fork, as zk-miner builds it. Released sppark (through 0.1.15) lacks
# four __syncthreads() in the GS NTT and in polynomial division (shared-memory races that corrupt
# proofs; upstream fixed them on master in 9e5c795 and 6b931f3), and its HIP shim defines a
# __syncwarp() that ROCm 7's headers also declare, so ROCm builds stop there. The fork has both
# fixes and a __syncwarp() that also orders LDS accesses on RDNA. Only CUDA/ROCm builds use sppark.
# This revision (the fork's zkminer/windows-amd) also builds on Windows: with MSVC as nvcc's host
# compiler, and with its `sppark` -> `..` symlink checked out as a plain file, as cargo does there.
# A [patch] applies to this workspace's builds only: a crate depending on this repository resolves
# sppark through its own lockfile and patches.
[patch.crates-io]
sppark = { git = "https://github.com/hemilabs/risc0-sppark", rev = "5f68eb3eb9e4e06c9837d22aade07ed40432889f" }
