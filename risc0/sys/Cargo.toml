[package]
name = "risc0-sys"
description = "Generated / Native / HAL code for RISC Zero"
version = "1.5.0"
edition = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
links = "risc0-sys"

[build-dependencies]
cc = { version = "1.2.2", features = ["parallel"] }
risc0-build-kernel = { workspace = true }

[dependencies]
anyhow = { version = "1.0", default-features = false }
blst = { version = "~0.3.11", optional = true }
cust = { version = "0.3", optional = true }
sppark = { workspace = true, optional = true }

[features]
default = []
cuda = ["dep:blst", "dep:cust", "dep:sppark"]
rocm = ["dep:blst", "dep:sppark"]
intel = []
metal = []
# Explicit opt-in: embed source for the system Metal runtime compiler instead
# of invoking the separately installed offline metal/metallib tools.
metal-runtime = ["metal"]
